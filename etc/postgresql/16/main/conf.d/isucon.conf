listen_addresses = '*'

# 計測用 (bench-capture.shから集計する)
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all

# asia2 はPostgreSQL専用 (メモリ約4GB、アプリは動いていない)
# アプリ3台 x 接続プール30 = 90本に、init.sh や計測の接続を足すと既定の100では足りなくなるため増やす
max_connections = 200
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 8MB
maintenance_work_mem = 256MB
