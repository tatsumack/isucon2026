listen_addresses = '*'

# 計測用 (bench-capture.shから集計する)
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all

# 画像 (平均360KB) の INSERT で WAL と共有バッファがあふれ、バックエンドが自分で書き出していたのを減らす
# 物理メモリ3.8GB・スワップなし・バックエンド1つで最大800MB使うため、1GBより小さくする
shared_buffers = 512MB
wal_buffers = 64MB
# ベンチ中にチェックポイントを起こさない (full page write を減らす)
max_wal_size = 8GB
checkpoint_timeout = 30min
# コミット時に fsync を待たない。正常な再起動では WAL を書き出してから止まるので、書き込んだデータは残る
synchronous_commit = off
