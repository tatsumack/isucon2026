upstream isureal_app {
  server 127.0.0.1:8080;
  # nginx とアプリ間のTCP接続をリクエストごとに作り直さない。
  keepalive 128;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  location /api/ {
    proxy_set_header Host $host;
    # アプリが付けるX-User-Idはログ用。クライアントには返さない
    proxy_hide_header X-User-Id;
    # 画像・export・アップロードを一時ファイル (/var/lib/nginx) に書かずメモリで扱う
    proxy_buffers 64 64k;
    proxy_busy_buffers_size 256k;
    proxy_max_temp_file_size 0;
    client_body_buffer_size 32m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://isureal_app;
  }

  # GET /api/images/:id でアプリが署名と配信してよいかを確かめたあと、X-Accel-Redirect でここへ渡す (go/image_store.go の AccelPath)。
  # internal なので外部から直接は取れない。Content-Type と Cache-Control はアプリの応答のものが使われる。
  # 今までのアプリの応答と揃えるため、ETag・Last-Modified・Range (304/206) は返さない。
  location /_images/ {
    internal;
    alias /home/isucon/images/;
    # asia1 はページキャッシュが小さく、画像をディスクから読むことが多い。読み込みをスレッドに任せ、
    # その間ワーカーが他の接続 (API の転送) を止めないようにする (#23313)
    aio threads;
    etag off;
    if_modified_since off;
    max_ranges 0;
    add_header Last-Modified "";
  }

  location / {
    try_files $uri /index.html;
  }
}
