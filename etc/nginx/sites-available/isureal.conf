upstream isureal_app {
  server 127.0.0.1:8080;
  # nginx とアプリ間のTCP接続をリクエストごとに作り直さない。
  keepalive 128;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  location /api/ {
    proxy_set_header Host $host;
    # アプリが付けるX-User-Idはログ用。クライアントには返さない
    proxy_hide_header X-User-Id;
    # 画像・export・アップロードを一時ファイル (/var/lib/nginx) に書かずメモリで扱う
    proxy_buffers 64 64k;
    proxy_busy_buffers_size 256k;
    proxy_max_temp_file_size 0;
    # 投稿の画像 (約430KB) はメモリに収まる大きさにする。32m では同時に届いた本文の数だけメモリを使い、
    # #18039 で asia1 の空きメモリが 135MB まで下がった。これを超える本文 (不正な大きい画像など) だけ一時ファイルに書く
    client_body_buffer_size 2m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://isureal_app;
  }

  location / {
    try_files $uri /index.html;
  }
}
